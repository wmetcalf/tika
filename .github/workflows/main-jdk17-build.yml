name: main jdk17 build

on:
  # NO `branches:` filter, deliberately. The previous form hardcoded `branches: [ main ]` --
  # inherited from upstream, where main IS the working branch. This fork has no `main` branch at
  # all -- work happens on 4.0-upstream-office-links -- so every one of those
  # filters matched nothing and these workflows had never run on a pull request in this repo.
  # Filtering by base branch re-arms that trap on the next rename; metadata-inventory.yml already
  # omits the filter and is the only workflow that has ever fired here.
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ 4.0-upstream-office-links ]
    paths-ignore:
      - 'docs/**'

# Superseded PR runs are dead work: cancel them. Never cancel a post-merge build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
