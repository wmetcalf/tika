name: main jdk21 build

on:
  # This had no `pull_request:` trigger at all, so JDK 21 never ran on a pull request
  # even though its own `concurrency` block below keys on `event_name == 'pull_request'`.
  # No `branches:` filter, for the same reason as the other builds.
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ 4.0-upstream-office-links ]
    paths-ignore:
      - 'docs/**'

# Superseded PR runs are dead work: cancel them. Never cancel a post-merge build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '21' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
